[versions]
java = "23"
spring-boot = "4.0.0"
spring-data-mongodb = "4.0.0"
spring-framework = "6.2.0"
jackson = "2.18.0"
cucumber = "8.0.0"
testcontainers = "1.20.0"
assertj = "3.27.0"
junit-jupiter = "5.12.0"
micrometer = "1.14.0"
mongodb-driver = "5.2.0"
logback = "1.5.0"

[libraries]
spring-boot-starter-data-mongodb = { group = "org.springframework.boot", name = "spring-boot-starter-data-mongodb" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
spring-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }

spring-data-mongodb = { group = "org.springframework.data", name = "spring-data-mongodb" }
spring-tx = { group = "org.springframework", name = "spring-tx" }

mongodb-driver-sync = { group = "org.mongodb", name = "mongodb-driver-sync", version.ref = "mongodb-driver" }
mongodb-driver-core = { group = "org.mongodb", name = "mongodb-driver-core", version.ref = "mongodb-driver" }

cucumber-java = { group = "io.cucumber", name = "cucumber-java", version.ref = "cucumber" }
cucumber-spring = { group = "io.cucumber", name = "cucumber-spring", version.ref = "cucumber" }
cucumber-junit-platform-engine = { group = "io.cucumber", name = "cucumber-junit-platform-engine", version.ref = "cucumber" }
cucumber-expressions = { group = "io.cucumber", name = "cucumber-expressions", version.ref = "cucumber" }

testcontainers-mongodb = { group = "org.testcontainers", name = "mongodb", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { group = "org.testcontainers", name = "junit-jupiter", version.ref = "testcontainers" }

assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

micrometer-core = { group = "io.micrometer", name = "micrometer-core", version.ref = "micrometer" }
micrometer-registry-prometheus = { group = "io.micrometer", name = "micrometer-registry-prometheus", version.ref = "micrometer" }

logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
